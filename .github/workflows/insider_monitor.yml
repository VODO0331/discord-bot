name: 美股內部人交易監控 (Insider Monitor)

on:
  schedule:
    - cron: "15 2 * * 2-6"  # 週二至週六 UTC 02:15 (台灣時間 10:15，美股盤後 SEC Form 4 申報匯總完成，避開整點尖峰)
  workflow_dispatch:        # 支援手動觸發

jobs:
  insider_monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v7

      - name: 設定 Python 環境
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝專案依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行美股內部人交易掃描與派發
        env:
          DISCORD_WEBHOOK_INSIDER_URL: ${{ secrets.DISCORD_WEBHOOK_INSIDER_URL }}
          DISCORD_WEBHOOK_ALERT_URL: ${{ secrets.DISCORD_WEBHOOK_ALERT_URL }}
          DISCORD_WEBHOOK_DAILY_URL: ${{ secrets.DISCORD_WEBHOOK_DAILY_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.LLM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py --mode insider --force
          else
            python main.py --mode insider
          fi
