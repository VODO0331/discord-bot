name: 台股盤後綜述 (Market Wrap)

on:
  schedule:
    # 提早至台灣時間 15:35 啟動階梯式排程，避開尖峰排隊延遲 (UTC+8 台灣時間週一至週五)
    - cron: "35 7 * * 1-5"   # 台灣 15:35 (UTC 07:35，首選)
    - cron: "55 7 * * 1-5"   # 台灣 15:55 (UTC 07:55，備援 1)
    - cron: "15 8 * * 1-5"   # 台灣 16:15 (UTC 08:15，備援 2)
    - cron: "40 8 * * 1-5"   # 台灣 16:40 (UTC 08:40，備援 3)
  workflow_dispatch:        # 支援手動觸發
    inputs:
      force:
        description: "是否強制發送（忽略重複防呆）"
        required: false
        default: "true"

jobs:
  market_wrap:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝專案依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行盤後綜述生成與派發
        env:
          DISCORD_WEBHOOK_DAILY_URL: ${{ secrets.DISCORD_WEBHOOK_DAILY_URL }}
          DISCORD_WEBHOOK_ALERT_URL: ${{ secrets.DISCORD_WEBHOOK_ALERT_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.LLM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py --mode wrap --force
          else
            python main.py --mode wrap
          fi
