name: 週末產業週報 (Weekly Deep-dive)

on:
  schedule:
    - cron: "0 2 * * 6"     # 每週六 UTC 02:00 (台灣時間 10:00)
  workflow_dispatch:        # 支援手動觸發

jobs:
  weekly_deepdive:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝專案依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行週末產業週報生成、派發與舊資料清理
        env:
          DISCORD_WEBHOOK_DAILY_URL: ${{ secrets.DISCORD_WEBHOOK_DAILY_URL }}
          DISCORD_WEBHOOK_ALERT_URL: ${{ secrets.DISCORD_WEBHOOK_ALERT_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python main.py --mode weekly
