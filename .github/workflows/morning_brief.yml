name: 台股開盤晨報 (Morning Brief)

on:
  schedule:
    # 避開 UTC 00:00 全球尖峰排程，提早至離峰時段階梯式觸發 (UTC+8 台灣時間週一至週五)
    - cron: "15 22 * * 0-4"  # 台灣 06:15 (UTC 22:15，離峰首選)
    - cron: "45 22 * * 0-4"  # 台灣 06:45 (UTC 22:45，備援 1)
    - cron: "15 23 * * 0-4"  # 台灣 07:15 (UTC 23:15，備援 2)
    - cron: "45 23 * * 0-4"  # 台灣 07:45 (UTC 23:45，備援 3)
  workflow_dispatch:        # 支援手動觸發
    inputs:
      force:
        description: "是否強制發送（忽略時間防呆）"
        required: false
        default: "true"

jobs:
  morning_brief:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝專案依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行開盤晨報生成與派發
        env:
          DISCORD_WEBHOOK_DAILY_URL: ${{ secrets.DISCORD_WEBHOOK_DAILY_URL }}
          DISCORD_WEBHOOK_ALERT_URL: ${{ secrets.DISCORD_WEBHOOK_ALERT_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.LLM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py --mode morning --force
          else
            python main.py --mode morning
          fi
